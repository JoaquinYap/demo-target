rules:
  - id: division-without-zero-guard
    message: >
      Division by a variable denominator with no prior zero-guard.
      This was the root cause of fe16d2d (ZeroDivisionError in analytics.py).
      Add `if <denominator> == 0: return 0.0` before the division, or use a
      conditional expression. See twins fixed in metrics.py and
      statistics_helpers.py (commit f740de9).
    severity: ERROR
    languages: [python]
    pattern-either:
      # Bare division by a function parameter with no guard on that param
      - patterns:
          - pattern: |
              def $FUNC(..., $Y, ...):
                  ...
                  $X / $Y
          - pattern-not: |
              def $FUNC(..., $Y, ...):
                  ...
                  if $Y == 0:
                      ...
                  ...
                  $X / $Y
          - pattern-not: |
              def $FUNC(..., $Y, ...):
                  ...
                  if $Y:
                      ...
                  ...
                  $X / $Y
          - pattern-not: |
              def $FUNC(..., $Y, ...):
                  ...
                  if not $Y:
                      ...
                  ...
                  $X / $Y
          - pattern-not: |
              def $FUNC(..., $Y, ...):
                  ...
                  if $Y is None:
                      ...
                  ...
                  $X / $Y
      # Division by a local variable with no preceding zero-check on that variable
      - patterns:
          - pattern: |
              $Y = ...
              ...
              $X / $Y
          - pattern-not: |
              $Y = ...
              ...
              if $Y == 0:
                  ...
              ...
              $X / $Y
          - pattern-not: |
              $Y = ...
              ...
              if $Y:
                  ...
              ...
              $X / $Y
          - pattern-not: |
              $Y = ...
              ...
              if not $Y:
                  ...
              ...
              $X / $Y
      # Floor-division by a function parameter with no guard
      - patterns:
          - pattern: |
              def $FUNC(..., $Y, ...):
                  ...
                  $X // $Y
          - pattern-not: |
              def $FUNC(..., $Y, ...):
                  ...
                  if $Y == 0:
                      ...
                  ...
                  $X // $Y
          - pattern-not: |
              def $FUNC(..., $Y, ...):
                  ...
                  if $Y:
                      ...
                  ...
                  $X // $Y
